name: Capture GitWave screenshots

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - README.md
      - music/**
      - ico-main/**
      - .github/workflows/capture-readme.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gitwave-readme-screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      DEPLOYED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Wait for GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for Pages deployment of $DEPLOYED_SHA"
          for attempt in $(seq 1 120); do
            run_info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$DEPLOYED_SHA&per_page=100" --jq '.workflow_runs[] | select(.name == "pages build and deployment") | [.id, .status, (.conclusion // "")] | @tsv' | tail -n 1)
            if [ -n "$run_info" ]; then
              IFS=$'\t' read -r run_id status conclusion <<< "$run_info"
              echo "Pages run $run_id: $status \${conclusion:-pending}"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "Pages deployment succeeded for $DEPLOYED_SHA"
                  exit 0
                fi
                echo "Pages deployment failed: $conclusion"
                exit 1
              fi
            fi
            sleep 5
          done
          echo "Timed out waiting for Pages deployment of $DEPLOYED_SHA"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        id: capture-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ${{ runner.temp }}/gitwave-capture/node_modules
          key: ${{ runner.os }}-gitwave-capture-v2
      - name: Install capture tools
        run: |
          if [ ! -d "$RUNNER_TEMP/gitwave-capture/node_modules/playwright" ]; then
            npm install --prefix "$RUNNER_TEMP/gitwave-capture" playwright
          fi
          if ! compgen -G "$HOME/.cache/ms-playwright/chromium-*" > /dev/null; then
            "$RUNNER_TEMP/gitwave-capture/node_modules/.bin/playwright" install --with-deps chromium
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Capture GitWave screens and all-tracks GIF
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/gitwave-capture/node_modules/playwright
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/screenshots /tmp/gitwave-library-frames /tmp/gitwave-gif-frames
          cat > capture-readme.cjs <<'EOF'
          const { chromium } = require(process.env.PLAYWRIGHT_PATH);
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1280, height: 800 }, deviceScaleFactor: 1, acceptDownloads: true });
            const page = await context.newPage();
            const fs = require('node:fs');
            const pageErrors = [];
            if (!process.env.GH_TOKEN) throw new Error('GitHub Actions token is missing for authenticated repository API access');
            await page.route('https://api.github.com/**', async route => {
              const headers = {
                ...route.request().headers(),
                authorization: 'Bearer ' + process.env.GH_TOKEN,
                'x-github-api-version': '2022-11-28'
              };
              const response = await route.fetch({ headers });
              await route.fulfill({ response });
            });
            page.setDefaultTimeout(45000);
            page.on('pageerror', error => pageErrors.push(String(error)));
            page.on('response', response => {
              if (response.status() >= 400) console.error('HTTP RESPONSE:', response.status(), response.url());
            });
            page.on('console', message => {
              if (message.type() === 'error') console.error('PAGE CONSOLE:', message.text());
            });
            const captureUrl = 'https://gamooda.github.io/gitwave/?capture=' + process.env.DEPLOYED_SHA;
            console.log('Opening deployed revision:', process.env.DEPLOYED_SHA, captureUrl);
            await page.goto(captureUrl, { waitUntil: 'domcontentloaded', timeout: 90000 });
            const waitForLibrary = async () => {
              await page.waitForFunction(() => {
                const grid = document.querySelector('#albumGrid');
                const status = document.querySelector('#syncStatus');
                return Boolean(grid && (grid.querySelector('.album-card') || status?.classList.contains('error')));
              }, null, { timeout: 180000 }).catch(async () => {
                const state = await page.evaluate(errors => ({
                  title: document.title,
                  url: location.href,
                  status: document.querySelector('#statusText')?.textContent || '',
                  statusClass: document.querySelector('#syncStatus')?.className || '',
                  empty: document.querySelector('#emptyTitle')?.textContent || '',
                  message: document.querySelector('#emptyMessage')?.textContent || '',
                  grid: document.querySelector('#albumGrid')?.innerHTML?.slice(0, 1200) || '',
                  errors
                }), pageErrors);
                throw new Error('GitWave library did not finish loading: ' + JSON.stringify(state));
              });
              await page.waitForSelector('#albumGrid .album-card', { state: 'visible', timeout: 45000 });
              await page.evaluate(() => document.fonts.ready);
            };
            await waitForLibrary();
            await page.waitForFunction(() => {
              const images = [...document.querySelectorAll('#albumGrid img')];
              return images.every(image => image.complete);
            }, null, { timeout: 20000 }).catch(() => {});
            let libraryFrame = 0;
            const captureLibrary = async (copies = 1) => {
              for (let i = 0; i < copies; i++) {
                await page.screenshot({ path: '/tmp/gitwave-library-frames/frame-' + String(libraryFrame++).padStart(4, '0') + '.png' });
              }
            };
            await captureLibrary(15);
            const albumCards = page.locator('#albumGrid .album-card:not([data-album-id="__all_tracks__"])');
            const albumCount = await albumCards.count();
            if (albumCount < 3) throw new Error('The library preview needs at least three albums, found ' + albumCount);
            for (let albumIndex = 0; albumIndex < 3; albumIndex++) {
              const card = albumCards.nth(albumIndex);
              const albumTitle = await card.locator('.album-name').textContent();
              await card.scrollIntoViewIfNeeded();
              await card.click();
              await page.locator('#playlistOverlay.open').waitFor({ state: 'visible', timeout: 30000 });
              const firstTrack = page.locator('#trackList .track-row').first();
              await firstTrack.waitFor({ state: 'visible', timeout: 30000 });
              await firstTrack.locator('[data-track-play]').click();
              await page.waitForTimeout(700);
              await captureLibrary(5);
              await page.locator('#closePlaylist').click();
              await page.locator('#playlistOverlay.open').waitFor({ state: 'hidden', timeout: 30000 });
              await page.waitForTimeout(300);
              await captureLibrary(15);
              console.log('Library preview played first track:', albumTitle);
            }
            console.log('Captured library GIF frames:', libraryFrame);
            await page.goto(captureUrl + '&preview=all-tracks', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await waitForLibrary();
            await page.locator('article[data-album-id="__all_tracks__"]').click();
            await page.locator('#playlistOverlay.open').waitFor({ state: 'visible', timeout: 30000 });
            await page.locator('#trackList .track-group-heading').first().waitFor({ state: 'visible', timeout: 30000 });
            const list = page.locator('#trackList');
            const groups = await list.locator('.track-group-heading').count();
            let frame = 0;
            const capture = async (copies = 1) => {
              for (let i = 0; i < copies; i++) {
                await page.screenshot({ path: '/tmp/gitwave-gif-frames/frame-' + String(frame++).padStart(4, '0') + '.png' });
              }
            };
            await capture(2);
            for (let g = 0; g < groups; g++) {
              const heading = list.locator('.track-group-heading').nth(g);
              const metrics = await heading.evaluate(el => {
                let node = el.nextElementSibling;
                let count = 0;
                let endTop = el.offsetTop;
                while (node && !node.classList.contains('track-group-heading')) {
                  if (node.classList.contains('track-row')) {
                    count++;
                    endTop = node.offsetTop;
                  }
                  node = node.nextElementSibling;
                }
                return { count, endTop };
              });
              if (!metrics.count) continue;
              await heading.scrollIntoViewIfNeeded();
              await page.waitForTimeout(150);
              const firstRow = heading.locator('xpath=following-sibling::div[contains(@class,"track-row")][1]');
              await firstRow.locator('[data-track-play]').click();
              await page.waitForTimeout(400);
              await capture(3);
              const from = await list.evaluate(el => el.scrollTop);
              const viewport = await list.evaluate(el => el.clientHeight);
              const target = Math.max(from, metrics.endTop - viewport + 110);
              const steps = Math.max(3, Math.ceil(Math.abs(target - from) / 220));
              for (let s = 1; s <= steps; s++) {
                const position = Math.round(from + (target - from) * s / steps);
                await list.evaluate((el, value) => { el.scrollTop = value; }, position);
                await page.waitForTimeout(80);
                await capture();
              }
              await page.waitForTimeout(120);
            }
            await list.evaluate(el => { el.scrollTop = el.scrollHeight; });
            await capture(15);
            console.log('Captured all-tracks GIF frames:', frame, 'categories:', groups);
            await page.goto(captureUrl + '&zip-test=1', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await waitForLibrary();
            await page.locator('#albumSort').selectOption('tracks-desc');
            const sortedTrackCounts = await page.locator('#albumGrid .album-card:not([data-album-id="__all_tracks__"]) .album-track-count').evaluateAll(nodes => nodes.map(node => Number.parseInt(node.textContent || '0', 10)));
            if (sortedTrackCounts.some((value, index) => index > 0 && sortedTrackCounts[index - 1] < value)) throw new Error('Album track-count sorting is incorrect');
            await page.locator('#albumSort').selectOption('default');
            const smallestAlbum = await page.locator('#albumGrid .album-card:not([data-album-id="__all_tracks__"])').evaluateAll(cards => {
              return cards.map((card, index) => ({
                index,
                count: Number.parseInt(card.querySelector('.album-track-count')?.textContent || '0', 10)
              })).filter(item => item.count > 0).sort((a, b) => a.count - b.count)[0];
            });
            if (smallestAlbum) {
              await page.locator('#albumGrid .album-card:not([data-album-id="__all_tracks__"])').nth(smallestAlbum.index).click();
              await page.locator('#playlistOverlay.open').waitFor({ state: 'visible', timeout: 30000 });
              await page.locator('#trackList .track-row').first().locator('[data-track-select]').click();
              const selectedLabel = await page.locator('#selectedTrackCount').textContent();
              if (!selectedLabel.includes('1') || await page.locator('#downloadSelectedBtn').isDisabled()) throw new Error('Track selection control did not update');
              await page.locator('#trackList .track-row').first().locator('[data-track-select]').click();
              if (!(await page.locator('#downloadSelectedBtn').isDisabled())) throw new Error('Track selection did not clear');
              await page.evaluate(() => {
                const browserState = { blobs: [] };
                const createObjectURL = URL.createObjectURL.bind(URL);
                URL.createObjectURL = blob => {
                  browserState.blobs.push(blob);
                  return createObjectURL(blob);
                };
                window.__gitwaveBrowserDownloadTest = browserState;
                const state = { options: null, chunks: [], bytes: null, completed: false };
                Object.defineProperty(window, "showSaveFilePicker", {
                  configurable: true,
                  writable: true,
                  value: async options => {
                    state.options = options;
                    state.chunks = [];
                    state.bytes = null;
                    state.completed = false;
                    return {
                      createWritable: async () => ({
                        async write(chunk) {
                          state.chunks.push(new Uint8Array(chunk));
                        },
                        async close() {
                          const size = state.chunks.reduce((sum, part) => sum + part.length, 0);
                          const result = new Uint8Array(size);
                          let offset = 0;
                          for (const part of state.chunks) {
                            result.set(part, offset);
                            offset += part.length;
                          }
                          state.bytes = result;
                          state.completed = true;
                        },
                        async abort() {
                          state.completed = false;
                        }
                      })
                    };
                  }
                });
                window.__gitwaveSaveAsTest = state;
              });
              await page.locator('#trackList .track-row').first().locator('[data-track-select]').click();
              const [selectedDownload] = await Promise.all([
                page.waitForEvent('download', { timeout: 180000 }),
                page.locator('#downloadSelectedBtn').click()
              ]);
              const selectedZip = await page.evaluate(async () => {
                const blob = window.__gitwaveBrowserDownloadTest.blobs.at(-1);
                if (!blob) return { error: 'No browser download Blob was created' };
                const head = new DataView(await blob.slice(0, 4).arrayBuffer()).getUint32(0, true);
                const tail = new Uint8Array(await blob.slice(Math.max(0, blob.size - 65558)).arrayBuffer());
                const view = new DataView(tail.buffer, tail.byteOffset, tail.byteLength);
                let end = -1;
                for (let i = tail.length - 22; i >= Math.max(0, tail.length - 65558); i--) {
                  if (view.getUint32(i, true) === 0x06054b50) { end = i; break; }
                }
                return { type: blob.type, size: blob.size, header: head, entries: end >= 0 ? view.getUint16(end + 10, true) : 0 };
              });
              if (!selectedDownload.suggestedFilename().includes('Выбранные треки') || selectedZip.header !== 0x04034b50 || selectedZip.entries !== 1) throw new Error('Browser selected ZIP download validation failed: ' + JSON.stringify({ filename: selectedDownload.suggestedFilename(), selectedZip }));
              await page.locator('#trackList .track-row').first().locator('[data-track-download]').click();
              const [singleDownload] = await Promise.all([
                page.waitForEvent('download', { timeout: 180000 }),
                page.locator('#trackList .track-row').first().locator('[data-track-download]').click()
              ]);
              const singleFile = await page.evaluate(() => {
                const blob = window.__gitwaveBrowserDownloadTest.blobs.at(-1);
                return { type: blob?.type || '', size: blob?.size || 0 };
              });
              if (!/\\.(mp3|ogg|wav)$/i.test(singleDownload.suggestedFilename()) || singleFile.size <= 0 || !singleFile.type.startsWith('audio/')) throw new Error('Browser individual download validation failed: ' + JSON.stringify({ filename: singleDownload.suggestedFilename(), singleFile }));
              await page.locator('#trackList .track-select-btn[aria-pressed="true"]').click();
              const [albumDownload] = await Promise.all([
                page.waitForEvent('download', { timeout: 180000 }),
                page.locator('#downloadZipBtn').click()
              ]);
              const albumZip = await page.evaluate(async () => {
                const blob = window.__gitwaveBrowserDownloadTest.blobs.at(-1);
                const head = new DataView(await blob.slice(0, 4).arrayBuffer()).getUint32(0, true);
                const tail = new Uint8Array(await blob.slice(Math.max(0, blob.size - 65558)).arrayBuffer());
                const view = new DataView(tail.buffer, tail.byteOffset, tail.byteLength);
                let end = -1;
                for (let i = tail.length - 22; i >= Math.max(0, tail.length - 65558); i--) {
                  if (view.getUint32(i, true) === 0x06054b50) { end = i; break; }
                }
                return { type: blob.type, size: blob.size, header: head, endSignature: end >= 0 ? view.getUint32(end, true) : 0, entries: end >= 0 ? view.getUint16(end + 10, true) : 0 };
              });
              if (!albumDownload.suggestedFilename().endsWith('.zip') || albumZip.header !== 0x04034b50 || albumZip.endSignature !== 0x06054b50 || albumZip.entries !== smallestAlbum.count) throw new Error('Browser album ZIP download validation failed: ' + JSON.stringify({ filename: albumDownload.suggestedFilename(), albumZip, expected: smallestAlbum.count }));
              await page.locator('#downloadZipSaveAsBtn').click();
              await page.waitForFunction(() => window.__gitwaveSaveAsTest?.completed && window.__gitwaveSaveAsTest?.bytes?.length > 0, null, { timeout: 180000 }).catch(async error => {
                const state = await page.evaluate(errors => ({
                  options: window.__gitwaveSaveAsTest?.options,
                  completed: window.__gitwaveSaveAsTest?.completed,
                  bytes: window.__gitwaveSaveAsTest?.bytes?.length || 0,
                  label: document.querySelector('#downloadZipLabel')?.textContent || '',
                  errors
                }), pageErrors);
                throw new Error('Save As streaming test did not finish: ' + JSON.stringify(state) + ' ' + error.message);
              });
              const saved = await page.evaluate(() => {
                const state = window.__gitwaveSaveAsTest;
                const bytes = state.bytes;
                const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
                let endOffset = -1;
                for (let index = bytes.length - 22; index >= Math.max(0, bytes.length - 65558); index--) {
                  if (view.getUint32(index, true) === 0x06054b50) {
                    endOffset = index;
                    break;
                  }
                }
                return {
                  fileName: state.options?.suggestedName || '',
                  mime: state.options?.types?.[0]?.accept?.['application/zip'] || [],
                  size: bytes.length,
                  header: bytes.length >= 4 ? view.getUint32(0, true) : 0,
                  endSignature: endOffset >= 0 ? view.getUint32(endOffset, true) : 0,
                  entries: endOffset >= 0 ? view.getUint16(endOffset + 10, true) : 0
                };
              });
              if (!saved.fileName.endsWith('.zip')) throw new Error('Save As picker did not suggest a ZIP filename: ' + saved.fileName);
              if (!saved.mime.includes('.zip')) throw new Error('Save As picker did not register ZIP file type');
              if (saved.header !== 0x04034b50 || saved.endSignature !== 0x06054b50) throw new Error('Save As archive has invalid headers');
              if (saved.entries !== smallestAlbum.count) throw new Error('Save As archive entry count does not match selected album');
              console.log('Verified browser downloads:', selectedDownload.suggestedFilename(), singleDownload.suggestedFilename(), albumDownload.suggestedFilename());
              console.log('Verified Save As ZIP:', saved.fileName, saved.size, 'bytes,', saved.entries, 'track(s)');
            }
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF
          node capture-readme.cjs
          rm capture-readme.cjs
          ffmpeg -y -framerate 6 -i /tmp/gitwave-library-frames/frame-%04d.png -vf "fps=6,scale=900:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=3:diff_mode=rectangle" -loop 0 docs/screenshots/library.gif
          ffmpeg -y -framerate 6 -i /tmp/gitwave-gif-frames/frame-%04d.png -vf "fps=6,scale=900:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=3:diff_mode=rectangle" -loop -1 docs/screenshots/all-tracks.gif
      - name: Commit screenshots and GIF
        run: |
          mkdir -p /tmp/gitwave-capture-result
          cp docs/screenshots/library.gif /tmp/gitwave-capture-result/library.gif
          cp docs/screenshots/all-tracks.gif /tmp/gitwave-capture-result/all-tracks.gif
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -f -B main origin/main
          mkdir -p docs/screenshots
          cp /tmp/gitwave-capture-result/library.gif docs/screenshots/library.gif
          cp /tmp/gitwave-capture-result/all-tracks.gif docs/screenshots/all-tracks.gif
          git rm -f docs/screenshots/library.png docs/screenshots/playlist.png || true
          git add docs/screenshots/library.gif docs/screenshots/all-tracks.gif
          if ! git diff --cached --quiet; then
            git commit -m "Add GitWave all-tracks animated preview"
            for attempt in 1 2 3; do
              if git push origin main; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
            done
            exit 1
          fi
