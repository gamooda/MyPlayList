name: Capture GitWave screenshots

on:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gitwave-readme-screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_commit.message, 'Add GitWave interface screenshots'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/gitwave-capture" playwright
          "$RUNNER_TEMP/gitwave-capture/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture published GitWave
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/gitwave-capture/node_modules/playwright
        run: |
          mkdir -p docs/screenshots
          cat > capture-readme.cjs <<'EOF'
          const { chromium } = require(process.env.PLAYWRIGHT_PATH);
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            page.setDefaultTimeout(60000);
            await page.goto('https://gamooda.github.io/gitwave/', { waitUntil: 'networkidle', timeout: 120000 });
            await page.locator('.album-card').first().waitFor({ state: 'visible', timeout: 120000 });
            await page.waitForTimeout(2500);
            await page.screenshot({ path: 'docs/screenshots/library.png', fullPage: true });
            await page.locator('.album-card').first().click();
            await page.locator('.playlist-window').waitFor({ state: 'visible', timeout: 60000 });
            await page.waitForTimeout(1200);
            await page.screenshot({ path: 'docs/screenshots/playlist.png', fullPage: true });
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF
          node capture-readme.cjs
          rm capture-readme.cjs
      - name: Commit screenshots
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/screenshots/library.png docs/screenshots/playlist.png
          if ! git diff --cached --quiet; then
            git commit -m "Add GitWave interface screenshots"
            git push origin main
          fi
