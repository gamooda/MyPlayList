name: Capture GitWave screenshots

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - README.md
      - music/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gitwave-readme-screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install capture tools
        run: |
          npm install --prefix "$RUNNER_TEMP/gitwave-capture" playwright
          "$RUNNER_TEMP/gitwave-capture/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Capture GitWave screens and all-tracks GIF
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/gitwave-capture/node_modules/playwright
        run: |
          mkdir -p docs/screenshots /tmp/gitwave-gif-frames
          cat > capture-readme.cjs <<'EOF'
          const { chromium } = require(process.env.PLAYWRIGHT_PATH);
          const fs = require('node:fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            page.setDefaultTimeout(60000);
            await page.goto('https://gamooda.github.io/gitwave/', { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.locator('.album-card').first().waitFor({ state: 'visible', timeout: 120000 });
            await page.waitForTimeout(2500);
            await page.screenshot({ path: 'docs/screenshots/library.png', fullPage: true });
            await page.locator('.album-card').first().click();
            await page.locator('.playlist-window').waitFor({ state: 'visible', timeout: 60000 });
            await page.waitForTimeout(1200);
            await page.screenshot({ path: 'docs/screenshots/playlist.png', fullPage: true });
            await page.locator('article[data-album-id="__all_tracks__"]').click();
            await page.locator('#trackList .track-row').first().waitFor({ state: 'visible', timeout: 60000 });
            await page.waitForTimeout(1000);
            const list = page.locator('#trackList');
            const dimensions = await list.evaluate(el => ({ height: el.scrollHeight, viewport: el.clientHeight }));
            const max = Math.max(0, dimensions.height - dimensions.viewport);
            const frames = Math.max(12, Math.min(28, Math.ceil(max / 180) + 1));
            for (let i = 0; i < frames; i++) {
              const position = frames === 1 ? max : Math.round(max * i / (frames - 1));
              await list.evaluate((el, value) => { el.scrollTop = value; }, position);
              await page.waitForTimeout(180);
              await page.screenshot({ path: '/tmp/gitwave-gif-frames/frame-' + String(i).padStart(3, '0') + '.png' });
            }
            await page.waitForTimeout(700);
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF
          node capture-readme.cjs
          rm capture-readme.cjs
          ffmpeg -y -framerate 5 -i /tmp/gitwave-gif-frames/frame-%03d.png -vf "fps=5,scale=960:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=3:diff_mode=rectangle" -loop 0 docs/screenshots/all-tracks.gif
      - name: Commit screenshots and GIF
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/screenshots/library.png docs/screenshots/playlist.png docs/screenshots/all-tracks.gif
          if ! git diff --cached --quiet; then
            git commit -m "Add GitWave all-tracks animated preview"
            git push origin main
          fi
