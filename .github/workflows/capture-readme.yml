name: Capture GitWave screenshots

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - .github/workflows/capture-readme.yml
      - music/**

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture published GitWave
        run: |
          mkdir -p docs/screenshots
          cat > /tmp/capture.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            await page.goto('https://gamooda.github.io/gitwave/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForSelector('.album-card',{timeout:120000});
            await page.waitForTimeout(2500);
            await page.screenshot({path:'docs/screenshots/library.png',fullPage:true});
            const first = page.locator('.album-card').first();
            await first.click();
            await page.waitForSelector('.playlist-window',{timeout:30000});
            await page.waitForTimeout(1200);
            await page.screenshot({path:'docs/screenshots/playlist.png',fullPage:true});
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          EOF
          node /tmp/capture.cjs
      - name: Commit screenshots
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/screenshots/library.png docs/screenshots/playlist.png
          if ! git diff --cached --quiet; then
            git commit -m "Add GitWave interface screenshots"
            git push
          fi
